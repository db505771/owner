<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fatty Family Mail</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:22px;
  background:#0e0e0e;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
h1{font-size:26px;letter-spacing:-.8px;margin:0}
.subtitle{color:#999;font-size:13px;margin-top:7px}
.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:25px}
button{
  border:0;border-radius:12px;padding:12px 16px;
  background:#fff;color:#000;font-weight:650;cursor:pointer
}
input{
  display:block;width:100%;padding:14px;margin:12px 0;
  border:1px solid #333;border-radius:12px;
  background:#191919;color:#fff;font-size:15px;outline:none
}
.panel{background:#171717;border:1px solid #292929;border-radius:16px;padding:18px;margin-bottom:16px}
.status{font-size:13px;color:#aaa;margin-bottom:16px;overflow-wrap:anywhere}
.email{padding:16px;background:#171717;border:1px solid #292929;border-radius:15px;margin-bottom:12px;cursor:pointer}
.subject{font-weight:650;font-size:15px;overflow-wrap:anywhere;margin-bottom:8px}
.sender{color:#aaa;font-size:12px;overflow-wrap:anywhere;margin-bottom:8px}
.date{font-size:11px;color:#777}
.body{display:none;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;font-size:13px;color:#ddd;border-top:1px solid #333;margin-top:14px;padding-top:14px}
.email.open .body{display:block}
.unread{display:inline-block;width:7px;height:7px;border-radius:50%;background:#8ab4f8;margin-right:7px}
.hidden{display:none}
button:disabled{opacity:.5}
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>Fatty Family Mail</h1>
    <div class="subtitle">Owner Mailbox · Full access</div>
  </div>
  <button onclick="loadEmails()" id="refresh">Refresh</button>
</div>
<div id="login" class="panel">
  <h3>Owner login</h3>
  <p class="subtitle">Sign in to access the owner mailbox.</p>
  <input id="accessCode" type="password" placeholder="Owner access code" autocomplete="current-password">
  <button onclick="login()">Continue</button>
</div>
<div id="status" class="status">Waiting for login.</div>
<div id="emails"></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbxZI7i0lDy1p5ph4V5DvWVY79KW-4kR6X3c081iMLIYVHyi7gnCtcP7jqVMelIvs4fpqQ/exec";
const LEVEL="owner";
const statusBox=document.getElementById("status");
const emailContainer=document.getElementById("emails");
const refreshButton=document.getElementById("refresh");
function setStatus(text){statusBox.textContent=text;}
function login(){
  const code=document.getElementById("accessCode").value.trim();
  if(!code){setStatus("Enter your access code.");return;}
  // Keep the code only for this page session.
  sessionStorage.setItem("ffm_access_code",code);
  document.getElementById("login").classList.add("hidden");
  loadEmails();
}
function loadEmails(){
  const code=sessionStorage.getItem("ffm_access_code");
  if(!code){
    document.getElementById("login").classList.remove("hidden");
    setStatus("Please sign in first.");
    return;
  }
  setStatus("Connecting to mailbox...");
  emailContainer.replaceChildren();
  refreshButton.disabled=true;
  const url=API_URL+
    "?action=emails&level="+encodeURIComponent(LEVEL)+
    "&accessCode="+encodeURIComponent(code)+
    "&_="+Date.now();
  fetch(url)
  .then(response=>{
    if(!response.ok)throw new Error("HTTP "+response.status);
    return response.json();
  })
  .then(data=>{
    if(!data.success){
      throw new Error(data.error||"Access denied.");
    }
    renderEmails(data.emails||[]);
    setStatus((data.emails||[]).length+" emails loaded.");
  })
  .catch(error=>{
    console.error(error);
    setStatus("Unable to load emails. Your backend authorization or API connection needs configuring.");
    document.getElementById("login").classList.remove("hidden");
  })
  .finally(()=>{refreshButton.disabled=false;});
}
function renderEmails(emails){
  emailContainer.replaceChildren();
  if(!emails.length){
    emailContainer.innerHTML='<div class="panel">No emails were returned.</div>';
    return;
  }
  emails.forEach(email=>{
    const card=document.createElement("div");
    card.className="email";
    const subject=document.createElement("div");
    subject.className="subject";
    if(email.unread){
      const dot=document.createElement("span");
      dot.className="unread";
      subject.appendChild(dot);
    }
    subject.appendChild(document.createTextNode(email.subject||"(No subject)"));
    const sender=document.createElement("div");
    sender.className="sender";
    sender.textContent=email.sender||"Unknown sender";
    const date=document.createElement("div");
    date.className="date";
    const parsed=new Date(email.date);
    date.textContent=isNaN(parsed.getTime())?"":parsed.toLocaleString();
    const body=document.createElement("div");
    body.className="body";
    body.textContent=email.body||"(No message text available)";
    card.append(subject,sender,date,body);
    card.onclick=()=>card.classList.toggle("open");
    emailContainer.appendChild(card);
  });
}
document.getElementById("accessCode").addEventListener("keydown",event=>{
  if(event.key==="Enter")login();
});
window.addEventListener("load",()=>{
  if(sessionStorage.getItem("ffm_access_code")){
    document.getElementById("login").classList.add("hidden");
    loadEmails();
  }
});
</script>
</body>
</html>
