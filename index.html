<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fatty Family Mail</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:22px;
  background:#0e0e0e;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
.header{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:24px
}
h1{font-size:25px;letter-spacing:-.8px;margin:0}
.subtitle{font-size:13px;color:#999;margin-top:7px}
button{
  border:0;border-radius:12px;padding:12px 16px;
  background:#fff;color:#000;font-weight:650;cursor:pointer
}
button:disabled{opacity:.5}
.status{
  padding:13px;background:#191919;border-radius:12px;
  font-size:13px;color:#bbb;margin-bottom:16px;
  overflow-wrap:anywhere
}
.email{
  padding:16px;background:#171717;border:1px solid #292929;
  border-radius:15px;margin-bottom:12px;cursor:pointer
}
.subject{font-size:15px;font-weight:650;margin-bottom:8px;overflow-wrap:anywhere}
.sender{font-size:12px;color:#aaa;margin-bottom:8px;overflow-wrap:anywhere}
.date{font-size:11px;color:#777}
.body{
  display:none;white-space:pre-wrap;overflow-wrap:anywhere;
  font-size:13px;line-height:1.6;color:#ddd;
  border-top:1px solid #333;margin-top:14px;padding-top:14px
}
.email.open .body{display:block}
.unread{
  display:inline-block;width:7px;height:7px;
  background:#8ab4f8;border-radius:50%;margin-right:7px
}
.empty{text-align:center;padding:40px 15px;color:#888}
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>Fatty Family Mail</h1>
    <div class="subtitle">Owner Mailbox · Full access</div>
  </div>
  <button id="refreshButton" onclick="loadEmails()">Refresh</button>
</div>
<div class="status" id="status">Connecting to mailbox...</div>
<div id="emails"></div>
<script>
const API_URL =
  "https://script.google.com/macros/s/AKfycbxZI7i0lDy1p5ph4V5DvWVY79KW-4kR6X3c081iMLIYVHyi7gnCtcP7jqVMelIvs4fpqQ/exec";
const LEVEL = "owner";
const statusBox = document.getElementById("status");
const emailContainer = document.getElementById("emails");
const refreshButton = document.getElementById("refreshButton");
let requestNumber = 0;
function setStatus(message) {
  statusBox.textContent = message;
}
function loadEmails() {
  const currentRequest = ++requestNumber;
  refreshButton.disabled = true;
  emailContainer.replaceChildren();
  setStatus("Connecting to Google Apps Script...");
  // JSONP requires the Apps Script endpoint to support callback.
  const callbackName =
    "ffmCallback_" + Date.now() + "_" + currentRequest;
  const url = API_URL +
    "?action=emails" +
    "&level=" + encodeURIComponent(LEVEL) +
    "&callback=" + encodeURIComponent(callbackName) +
    "&_=" + Date.now();
  let script = document.createElement("script");
  const timeout = setTimeout(() => {
    cleanup();
    setStatus(
      "Connection timed out. The Apps Script API must support JSONP callbacks."
    );
  }, 20000);
  function cleanup() {
    clearTimeout(timeout);
    delete window[callbackName];
    if (script && script.parentNode) {
      script.parentNode.removeChild(script);
    }
    refreshButton.disabled = false;
  }
  window[callbackName] = function(data) {
    cleanup();
    if (currentRequest !== requestNumber) return;
    if (!data || !data.success) {
      setStatus(
        data && data.error
          ? data.error
          : "The API returned an invalid response."
      );
      return;
    }
    renderEmails(Array.isArray(data.emails) ? data.emails : []);
    setStatus(
      data.emails.length +
      (data.emails.length === 1 ? " email loaded." : " emails loaded.")
    );
  };
  script.onerror = function() {
    cleanup();
    if (currentRequest === requestNumber) {
      setStatus(
        "The API couldn't be reached. Check the Apps Script deployment."
      );
    }
  };
  script.src = url;
  document.head.appendChild(script);
}
function renderEmails(emails) {
  emailContainer.replaceChildren();
  if (emails.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No emails were returned.";
    emailContainer.appendChild(empty);
    return;
  }
  emails.forEach(email => {
    const card = document.createElement("div");
    card.className = "email";
    const subject = document.createElement("div");
    subject.className = "subject";
    if (email.unread) {
      const dot = document.createElement("span");
      dot.className = "unread";
      subject.appendChild(dot);
    }
    subject.appendChild(
      document.createTextNode(email.subject || "(No subject)")
    );
    const sender = document.createElement("div");
    sender.className = "sender";
    sender.textContent = email.sender || "Unknown sender";
    const date = document.createElement("div");
    date.className = "date";
    const parsedDate = new Date(email.date);
    date.textContent = isNaN(parsedDate.getTime())
      ? ""
      : parsedDate.toLocaleString();
    const body = document.createElement("div");
    body.className = "body";
    body.textContent = email.body || "(No message text available)";
    card.append(subject, sender, date, body);
    card.addEventListener("click", () => {
      card.classList.toggle("open");
    });
    emailContainer.appendChild(card);
  });
}
loadEmails();
</script>
</body>
</html>
