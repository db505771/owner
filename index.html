<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fatty Family Mail</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #0e0e0e;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 25px;
      letter-spacing: -0.8px;
    }

    .level {
      color: #aaa;
      font-size: 12px;
      margin-top: 6px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 11px 15px;
      background: white;
      color: black;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .status {
      padding: 13px;
      background: #191919;
      border-radius: 12px;
      color: #bbb;
      font-size: 13px;
      margin-bottom: 16px;
      overflow-wrap: anywhere;
    }

    .email {
      background: #171717;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      cursor: pointer;
    }

    .email:active {
      background: #222;
    }

    .subject {
      font-weight: 650;
      font-size: 15px;
      margin-bottom: 8px;
      overflow-wrap: anywhere;
    }

    .sender {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 8px;
      overflow-wrap: anywhere;
    }

    .date {
      font-size: 11px;
      color: #777;
    }

    .body {
      display: none;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 13px;
      line-height: 1.6;
      color: #ddd;
      border-top: 1px solid #333;
      margin-top: 14px;
      padding-top: 14px;
    }

    .email.open .body {
      display: block;
    }

    .unread {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #8ab4f8;
      border-radius: 50%;
      margin-right: 7px;
      vertical-align: middle;
    }

    .empty {
      text-align: center;
      padding: 40px 15px;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="header">
    <div>
      <h1>Fatty Family Mail</h1>
      <div class="level" id="levelLabel">Owner Mailbox</div>
    </div>

    <button id="refreshButton" onclick="loadEmails()">
      Refresh
    </button>
  </div>

  <div class="status" id="status">
    Connecting to your mailbox...
  </div>

  <div id="emails"></div>

  <script>
    // ==========================================
    // CONFIGURATION
    // ==========================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbxZI7i0lDy1p5ph4V5DvWVY79KW-4kR6X3c081iMLIYVHyi7gnCtcP7jqVMelIvs4fpqQ/exec";

    // OWNER REPOSITORY
    const LEVEL = "owner";

    // ==========================================

    const statusBox = document.getElementById("status");
    const emailContainer = document.getElementById("emails");
    const refreshButton = document.getElementById("refreshButton");

    document.getElementById("levelLabel").textContent =
      LEVEL.charAt(0).toUpperCase() + LEVEL.slice(1) + " Mailbox";

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function loadEmails() {
      setStatus("Connecting to Google Apps Script...");
      emailContainer.innerHTML = "";
      refreshButton.disabled = true;

      const url =
        API_URL +
        "?action=emails&level=" +
        encodeURIComponent(LEVEL) +
        "&_=" +
        Date.now();

      fetch(url)
        .then(response => {
          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }

          return response.json();
        })
        .then(data => {
          if (!data.success) {
            throw new Error(
              data.error || "The server rejected the request."
            );
          }

          if (!Array.isArray(data.emails)) {
            throw new Error("The server returned an unexpected response.");
          }

          renderEmails(data.emails);

          setStatus(
            data.emails.length +
            (data.emails.length === 1 ? " email loaded." : " emails loaded.")
          );
        })
        .catch(error => {
          console.error("Mailbox error:", error);

          setStatus(
            "Couldn't load emails. " +
            "Check the API connection, server permissions, and authorization settings."
          );
        })
        .finally(() => {
          refreshButton.disabled = false;
        });
    }

    function renderEmails(emails) {
      emailContainer.innerHTML = "";

      if (emails.length === 0) {
        emailContainer.innerHTML =
          '<div class="empty">No emails were returned.</div>';
        return;
      }

      emails.forEach(email => {
        const card = document.createElement("div");
        card.className = "email";

        const subject = document.createElement("div");
        subject.className = "subject";

        if (email.unread) {
          const dot = document.createElement("span");
          dot.className = "unread";
          subject.appendChild(dot);
        }

        subject.appendChild(
          document.createTextNode(email.subject || "(No subject)")
        );

        const sender = document.createElement("div");
        sender.className = "sender";
        sender.textContent = email.sender || "Unknown sender";

        const date = document.createElement("div");
        date.className = "date";

        const parsedDate = new Date(email.date);

        date.textContent = isNaN(parsedDate.getTime())
          ? ""
          : parsedDate.toLocaleString();

        const body = document.createElement("div");
        body.className = "body";
        body.textContent = email.body || "(No message text available)";

        card.append(subject, sender, date, body);

        card.addEventListener("click", () => {
          card.classList.toggle("open");
        });

        emailContainer.appendChild(card);
      });
    }

    loadEmails();
  </script>
</body>
</html>
